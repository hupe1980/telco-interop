<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"TechArticle",
  "headline":{{ headline | json_encode | safe }},
  "description":{{ desc | json_encode | safe }},
  "url":{{ current_url | json_encode | safe }},"inLanguage":"en",
  "image":{{ get_url(path="og.png") | json_encode | safe }},
  "proficiencyLevel":"Expert",
  "about":["WBCI","S/PRI","Anbieterwechsel","§ 59 TKG","Rust"],
  "isPartOf":{"@type":"WebSite","name":"telco-interop","url":{{ config.base_url | json_encode | safe }}},
  "author":{"@type":"Person","name":{{ config.author | json_encode | safe }}}},
 {"@type":"BreadcrumbList","itemListElement":[
  {"@type":"ListItem","position":1,"name":"telco-interop","item":{{ get_url(path='@/_index.md') | json_encode | safe }}},
  {"@type":"ListItem","position":2,"name":"Documentation","item":{{ get_url(path='@/docs/_index.md') | json_encode | safe }}}
  {%- if crumb_section %},
  {"@type":"ListItem","position":3,"name":{{ crumb_section.title | json_encode | safe }},"item":{{ crumb_section.permalink | json_encode | safe }}}
  {%- endif %}
  {%- if crumb_page %},
  {"@type":"ListItem","position":{% if crumb_section %}4{% else %}3{% endif %},"name":{{ crumb_page.title | json_encode | safe }},"item":{{ crumb_page.permalink | json_encode | safe }}}
  {%- endif %}]}]}
</script>
