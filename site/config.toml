base_url = "https://hupe1980.github.io/telco-interop"
title = "telco-interop: WBCI and S/PRI for Rust"
description = "Rust crates for the German carrier interfaces: WBCI for the § 59 TKG provider switch, S/PRI for open-access fibre orders. Typed, sans-I/O, schema-proven."

default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
generate_sitemap = true
generate_robots_txt = true
minify_html = true
author = "hupe1980"

[link_checker]
# The repository is linked before it is public; crates.io and docs.rs refuse bots.
skip_prefixes = ["https://crates.io/", "https://docs.rs/", "https://ak-spri.de/", "https://github.com/hupe1980/telco-interop"]

[markdown]
smart_punctuation = true
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark-default"

[extra]
repo = "https://github.com/hupe1980/telco-interop"
crate_url = "https://crates.io/crates/telco-interop"
api_url = "https://docs.rs/telco-interop"
# The docs sidebar, in order; previous/next links follow it.
docs_sections = [
  "docs/start/_index.md",
  "docs/wbci/_index.md",
  "docs/spri/_index.md",
  "docs/across-both/_index.md",
  "docs/reference/_index.md",
]
