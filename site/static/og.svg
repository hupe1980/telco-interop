<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="telco-interop: WBCI and S/PRI, the German provider switch, in Rust">
  <!-- Source of og.png: rsvg-convert -w 1200 -h 630 site/static/og.svg -o site/static/og.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f33"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7a2e8f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a2e8f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(80 78)">
    <rect width="64" height="64" rx="14" fill="#7a2e8f"/>
    <path d="M14 24h32l-8-8M50 40H18l8 8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">telco-interop</text>
  </g>

  <text x="80" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1.5">WBCI &amp; S/PRI in Rust</text>
  <text x="80" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e3c7ee">The German provider switch (§ 59 TKG), typed and sans-I/O</text>

  <!-- one switch, two lanes -->
  <g font-family="Menlo, SF Mono, Consolas, monospace" font-size="21" font-weight="700">
    <line x1="80" y1="430" x2="1120" y2="430" stroke="#4a3a52" stroke-width="2"/>
    <line x1="80" y1="500" x2="1120" y2="500" stroke="#2b4448" stroke-width="2"/>
    <g fill="#2d1836" stroke="#dcb0ea" stroke-width="2">
      <rect x="80" y="408" width="170" height="44" rx="8"/>
      <rect x="266" y="408" width="130" height="44" rx="8"/>
      <rect x="412" y="408" width="124" height="44" rx="8"/>
    </g>
    <g fill="#ffffff">
      <text x="96" y="437">VA-KUE-MRN</text>
      <text x="282" y="437">RUEM-VA</text>
      <text x="430" y="437">AKM-TR</text>
    </g>
    <g fill="#10282b" stroke="#7fd3da" stroke-width="2">
      <rect x="552" y="478" width="60" height="44" rx="8"/>
      <rect x="628" y="478" width="70" height="44" rx="8"/>
      <rect x="714" y="478" width="100" height="44" rx="8"/>
      <rect x="830" y="478" width="70" height="44" rx="8"/>
      <rect x="916" y="478" width="84" height="44" rx="8"/>
      <rect x="1016" y="478" width="84" height="44" rx="8"/>
    </g>
    <g fill="#ffffff">
      <text x="582" y="507" text-anchor="middle">PV</text>
      <text x="663" y="507" text-anchor="middle">QEB</text>
      <text x="764" y="507" text-anchor="middle">AKM-PV</text>
      <text x="865" y="507" text-anchor="middle">ABM</text>
      <text x="958" y="507" text-anchor="middle">ERLM</text>
      <text x="1058" y="507" text-anchor="middle">ENTM</text>
    </g>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
      <text x="1120" y="400" text-anchor="end" fill="#dcb0ea">WBCI</text>
      <text x="1120" y="560" text-anchor="end" fill="#7fd3da">S/PRI</text>
    </g>
  </g>

  <text x="80" y="585" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#a3abb8">Proven against the official XSDs · fuzzed · MIT / Apache-2.0</text>
</svg>
