name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release gate calls CI rather than copying it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  lint:
    name: Format, Clippy, Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: bash scripts/boundary-check.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p telco-interop --all-targets --features cli -- -D warnings
      - run: cargo doc --workspace --no-deps
      - name: telco-interop builds with each feature alone
        run: |
          cargo build -p telco-interop --no-default-features
          cargo build -p telco-interop --no-default-features --features wbci
          cargo build -p telco-interop --no-default-features --features spri
      - name: The library pulls no clap without the cli feature
        run: test "$(cargo tree -p telco-interop -e normal | grep -c clap)" = 0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-targets
      - run: cargo test -p telco-interop --features cli --all-targets
      - run: cargo test --workspace --doc
      - run: cargo run -p wbci --example switch

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-targets
      - run: cargo test -p telco-interop --features cli --all-targets

  supply-chain:
    name: Dependencies and package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The AK S&P's documents are never published (AGENTS.md).
      - name: No specification documents in packages
        run: |
          for crate in carrier-core wbci spri telco-interop wita-kit; do
            if cargo package -p "$crate" --list --allow-dirty | grep -Ei '\.(xsd|wsdl|pdf)$'; then
              echo "::error::$crate would ship a specification document"; exit 1
            fi
          done

  schema:
    name: Conformance (official WBCI XSD V2.00, S/PRI XSD 4.00.03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # Downloaded and pinned by SHA-256, never committed. A changed publication
      # fails here: review the new schema, then update the pin.
      - name: Fetch the schemas
        run: |
          bash scripts/fetch-wbci-xsd.sh
          bash scripts/fetch-spri-xsd.sh
      - name: Validate the WBCI corpus
        env:
          WBCI_XSD_REQUIRED: "1"
        run: cargo test -p wbci --test schema -- --nocapture
      - name: Validate the S/PRI corpus
        env:
          SPRI_XSD_REQUIRED: "1"
        run: cargo test -p spri --test schema -- --nocapture

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: read
            fixtures: crates/wbci/tests/fixtures
          - target: read_spri
            fixtures: crates/spri/tests/fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz
      - name: Seed corpus from the fixtures
        run: mkdir -p "fuzz/corpus/${{ matrix.target }}" && cp ${{ matrix.fixtures }}/*.xml "fuzz/corpus/${{ matrix.target }}/"
      - name: Run
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=120
