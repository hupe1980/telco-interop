name: Site

# The playground is built from the crates, so a crate change redeploys it too.
on:
  push:
    branches: [main]
    paths: ["site/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The playground module (as `just playground`): telco_interop::report as WebAssembly.
      - name: Build the playground
        run: |
          cargo build -p playground --target wasm32-unknown-unknown --profile playground
          mkdir -p site/static/playground
          cp target/wasm32-unknown-unknown/playground/playground.wasm site/static/playground/playground.wasm
          size=$(wc -c < site/static/playground/playground.wasm)
          echo "playground.wasm: $size bytes"
          test "$size" -le 1572864
      - name: Install Zola
        run: |
          ZOLA_VERSION=0.23.6
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      # `check` validates internal links and anchors.
      - name: Check
        working-directory: site
        run: zola check
      - name: Build
        working-directory: site
        run: zola build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/public

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
